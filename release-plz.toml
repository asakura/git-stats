# release-plz configuration: https://release-plz.dev/docs/config
[workspace]
changelog_config = "cliff.toml"
changelog_update = true
git_release_enable = false
git_tag_enable = false
pr_labels = ["release"]

# One git tag / GitHub release per version, carrying the source archive
# (GitHub's automatic zip/tarball) plus the binaries that
# release-binaries.yml attaches on `release: published`.
[[package]]
name = "dps-git-stats"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
git_release_enable = true
git_tag_enable = true
