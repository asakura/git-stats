# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Run locally with `nix develop -c cargo deny check` (or plain `cargo deny
# check` if cargo-deny is installed). CI runs this as part of `ci.yml`.

[graph]
all-features = false
no-default-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
unsound = "all"
unmaintained = "all"
yanked = "warn"
maximum-db-staleness = "P30D"
unused-ignored-advisory = "warn"

# All of these are transitive via `polars` and `gix`. Vetted as acceptable
# until upstream bumps or replaces the affected crates.
ignore = [
    # Unmaintained, pulled in by `polars-arrow`.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; transitive via polars-arrow/chrono-tz" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; transitive via polars-arrow" },
    # `heapless` 0.8.0 unsoundness, pulled in by `faster-hex` 0.10 (via
    # `gix-hash`).
    { id = "RUSTSEC-2026-0574", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0575", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0576", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0577", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0578", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0579", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0580", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0581", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0582", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # allowed, but no matching crates yet
    # "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "warn"

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Vetted duplicate versions: a transitive dependency is still pinned to an
# older major/minor release while the rest of the graph has moved on. Each
# entry skips that older version so `multiple-versions` stays quiet for this
# known pair and would only fire again if a *third* version showed up.

# 0.14.5 is pinned by `dashmap`, 0.15.5 by `planus` (via `polars`), and
# 0.16.1 by `clru` (via `gix-pack`); `gix-hashtable` is on the newest, 0.17.2.
[[bans.skip]]
name = "hashbrown"
version = "0.14.5"

[[bans.skip]]
name = "hashbrown"
version = "0.15.5"

[[bans.skip]]
name = "hashbrown"
version = "0.16.1"

# Two `syn` majors coexist while proc-macro crates migrate to 3.x.
[[bans.skip]]
name = "syn"
version = "3.0.3"

# 0.10.1 is pinned by `gix-hash`; `gix-packetline` is on 2.0.0.
[[bans.skip]]
name = "faster-hex"
version = "0.10.1"

# 0.1.5 is pinned by `hashbrown` 0.15.5; newer `hashbrown` and
# `polars-utils` are on 0.2.0.
[[bans.skip]]
name = "foldhash"
version = "0.1.5"

# 0.3.4 is pinned by `tempfile` (via `gix-odb`/`gix-tempfile`); `gix-utils`,
# `polars-core`, `rand` and `uuid` are on 0.4.3.
[[bans.skip]]
name = "getrandom"
version = "0.3.4"

[bans.build]
include-workspace = false
include-dependencies = true
executables = "warn"
interpreted = "warn"

[[bans.build.bypass]]
name = "blake3"
version = "1.8.7"
allow = [
    { path = ".github/workflows/build_b3sum.py", checksum = "92a71b05b250751d2dc30c8b19b96902df554ec74fb4420ad601e8225ef2ff6e" },
    { path = ".github/workflows/upload_github_release_asset.py", checksum = "4e3cec6aa141b7baec6a5ad476c4d996cf91cdcf91b3ebc286116d345d452001" },
    { path = "c/test.py", checksum = "3b466433c2022d821cdc784687bb7e9927e41e8064a6815f6ae16d8b0279ed41" },
]

[[bans.build.bypass]]
name = "now"
version = "0.1.3"
allow = [
    { path = ".cargo-husky/hooks/pre-commit", checksum = "66f071376797f56bea2bb15a6e9979b0472b43a7bab386b1dcdb6d82850ec18a" },
]

[[bans.build.bypass]]
name = "zerocopy"
version = "0.8.64"
allow = [
    { path = "cargo.sh", checksum = "d768564f52bd56cfe72a85a30bd2ac407bc56c862da44fd8f7ba9e1310347042" },
    { path = "ci/check_all_toolchains_tested.sh", checksum = "979cece8aff80ff997bc317f9e48bb9f9a8c36486e7f23d7f1e869c75f03de85" },
    { path = "ci/check_fmt.sh", checksum = "83e6654d1b6658c6d65c8b0beb4cbe7aaaa0cbf3cd4cc4d196d40b7c21f8d9eb" },
    { path = "ci/check_msrv_is_minimal.sh", checksum = "b6adac6e751ef1dd5927090b30bb098a64e9c9c50e047562088b889e25c2d5fc" },
    { path = "ci/check_packaging.sh", checksum = "d4aad60df4815276c54ad37e7cbf24b637a106a9f364f37bbd7412cbf54e2390" },
    { path = "ci/check_readme.sh", checksum = "c23dc51696893e171018fb1cb86b7c606a2cd3ad4800c7a44f913a1451607c5e" },
    { path = "ci/check_stale_stderr.sh", checksum = "61a25ca45e05e684c31af4f926c15c7d7f97945f90a744038ab45816799dc6d0" },
    { path = "ci/check_versions.sh", checksum = "c2603621c4981c1400d946cd83b2d3af0ba7db2355779b55eab89ca2c821fe0d" },
    { path = "ci/release_crate_version.sh", checksum = "e5f4b957eae4251f66a9497cc596533d767d97a841556c5c18425aa7259005eb" },
